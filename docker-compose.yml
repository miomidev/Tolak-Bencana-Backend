services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tolakbencana-web
    restart: always
    ports:
      - "8091:80"
    volumes:
      # Persist storage directory untuk uploads (foto laporan, avatar, APK)
      - ./storage:/var/www/html/storage
      # Mount environment file agar tidak hilang saat rebuild
      - ./.env:/var/www/html/.env
    networks:
      - db_network
      - npm_network

networks:
  db_network:
    external: true
    name: bimbelrbs_network
  npm_network:
    external: true
    name: npm_default
